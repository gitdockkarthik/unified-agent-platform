# infra/railway.toml — REFERENCE SUMMARY (not read by Railway directly)
#
# This file documents the Railway configuration for all four services in one place.
# Each service's live railway.toml is at its own Root Directory:
#
#   backend         →  /railway.toml               (Root Dir: /)
#   portal          →  portal/railway.toml          (Root Dir: portal/)
#   alert-analyser  →  agents/alert-analyser/railway.toml
#   cur-analyser    →  agents/cur-analyser/railway.toml
#
# For the full setup procedure see: infra/railway-setup.md

# ── backend ───────────────────────────────────────────────────────────────────
# Root Directory: /   Dockerfile: backend/Dockerfile
[services.backend.build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "shared/**"]

[services.backend.deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── portal ────────────────────────────────────────────────────────────────────
# Root Directory: portal/   Dockerfile: Dockerfile
[services.portal.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[services.portal.deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── alert-analyser ────────────────────────────────────────────────────────────
# Root Directory: agents/alert-analyser/   Dockerfile: Dockerfile
[services.alert-analyser.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[services.alert-analyser.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── cur-analyser ──────────────────────────────────────────────────────────────
# Root Directory: agents/cur-analyser/   Dockerfile: Dockerfile
[services.cur-analyser.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[services.cur-analyser.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
