server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve all HTML including subdirectories; SPA fallback to index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        auth_basic "${AUTH_REALM}";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Serve admin subdirectory cleanly
    location /admin/ {
        try_files $uri $uri/ $uri.html /admin/index.html;
    }

    # Clean /docs URL — redirect bare /docs to /docs/
    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ $uri.html /docs/index.html;
    }

    # Aggressive caching for versioned assets; none for HTML
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint for Railway / load balancers
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
