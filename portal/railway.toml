# railway.toml — portal service
#
# Railway dashboard settings for this service:
#   Source:          GitHub repo (this monorepo)
#   Root Directory:  portal/
#   Dockerfile Path: Dockerfile   (relative to Root Directory)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
# docker-entrypoint.sh runs envsubst then execs nginx; no startCommand override needed.
# Railway sets $PORT automatically — nginx listens on 80 regardless (Railway proxy handles TLS).
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
