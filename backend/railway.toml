# railway.toml — backend service
#
# Railway dashboard settings for this service:
#   Source:          GitHub repo (this monorepo)
#   Root Directory:  backend/
#   Dockerfile Path: Dockerfile   (relative to Root Directory)
#
# shared/ is no longer needed at build time — InvokeRequest/InvokeResponse are
# defined locally in orchestrator/schemas.py.
#
# Reference summary of all service configs: infra/railway.toml
# Step-by-step setup guide:              infra/railway-setup.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]
